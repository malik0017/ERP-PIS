<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ 'rtl' if is_rtl|default(false) else 'ltr' }}" data-navigation-type="default" data-navbar-horizontal-shape="default">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!--    Favicons-->

    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='img/favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='img/favicons/favicon-16x16.png') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', path='img/favicons/favicon.ico') }}">
    <link rel="manifest" href="{{ url_for('static', path='img/favicons/manifest.json') }}">
    <meta name="msapplication-TileImage" content="{{ url_for('static', path='img/favicons/mstile-150x150.png') }}">

    <script src="{{ url_for('static', path='vendors/simplebar/simplebar.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/config.js') }}"></script>
    <!-- Batch 99: theme controller loads HERE, in <head>, before the body
         renders. Loading it at the end of <body> like the other ISFC scripts
         would mean the page paints in light mode and then snaps to dark on
         every single navigation. -->
    <script src="{{ url_for('static', path='js/isfc-theme.js') }}"></script>
    <style>
      /* Batch 99 — navbar fixes.
         Scoped to isfc- classes so nothing here can bleed into Phoenix's own
         components or the RTL stylesheet. */
      .isfc-bell-badge{
        top:2px; inset-inline-end:0; font-size:.62rem; line-height:1;
        padding:.25em .4em; min-width:1.05rem; z-index:2;
      }
      .isfc-header-avatar{
        width:100%; height:100%; object-fit:cover;   /* cover: fill the circle, no letterboxing */
      }
      .isfc-brand-logo{
        width:50px; height:50px; object-fit:contain;  /* contain: never crop a customer's logo */
        max-width:50px; max-height:50px;
      }
      /* ================================================================
         Batch 102 — dark mode, done properly.

         Batches 99/100/101 each patched one failure mode of the vendor's
         toggle and each time another was underneath:
           - the checkbox is display:none
           - the two <label for> pointed at ids duplicated across 7 navbars
           - the feather <svg> is only clickable on its painted stroke
         Three stacked failure modes in one control is a control worth
         replacing, not patching. It is now a plain <button>.

         The icon swap is driven by [data-bs-theme] on <html> — the same
         attribute the theme itself uses — instead of a checkbox's :checked
         state, so the icon reflects the real theme even if nothing else on
         the page is in sync.
         ================================================================ */
      .isfc-theme-btn{
        color:inherit; line-height:1; width:2rem; height:2rem;
        display:inline-flex; align-items:center; justify-content:center;
        text-decoration:none; border:0; background:none; cursor:pointer;
      }
      .isfc-theme-btn:hover{ color:inherit; opacity:.75; }
      /* Icons click-transparent so every pixel of the button works. */
      .isfc-theme-btn i{ pointer-events:none; font-size:1.05rem; }
      .isfc-theme-icon-dark{ display:none; }
      [data-bs-theme="dark"] .isfc-theme-icon-light{ display:none; }
      [data-bs-theme="dark"] .isfc-theme-icon-dark{ display:inline-block; }
    </style>

    <!-- ===============================================-->
    <!--    Stylesheets-->
    <!-- ===============================================-->
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap" rel="stylesheet">
    <!-- <link href="{{ url_for('static', path='css/theme-rtl.min.css') }}" rel="stylesheet"> -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/line.css') }}">
    <!-- Batch 9: Bootstrap Icons (bi-*) — many templates use these classes; font was missing before. -->
    <link rel="stylesheet" href="{{ url_for('static', path='vendors/bootstrap-icons/bootstrap-icons.min.css') }}">
    <link href="{{ url_for('static', path='vendors/simplebar/simplebar.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='vendors/swiper/swiper-bundle.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='css/theme-rtl.min.css') }}" type="text/css" rel="stylesheet" id="style-rtl">
    <link href="{{ url_for('static', path='css/theme.min.css') }}" type="text/css" rel="stylesheet" id="style-default">
    <link href="{{ url_for('static', path='css/user-rtl.min.css') }}" type="text/css" rel="stylesheet" id="user-style-rtl">
    <link href="{{ url_for('static', path='css/user.min.css') }}" type="text/css" rel="stylesheet" id="user-style-default">
    <link href="{{ url_for('static', path='css/isfc-dark.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='css/isfc-layout.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='css/isfc-polish.css') }}" rel="stylesheet"><!-- Batch 73: global polish -->
    <link href="{{ url_for('static', path='css/isfc-density.css') }}" rel="stylesheet"><!-- Batch 80: global density compaction -->

    <script>
      var phoenixIsRTL = {{ 'true' if is_rtl|default(false) else 'window.config.config.phoenixIsRTL' }};
      if (phoenixIsRTL) {
        var linkDefault = document.getElementById('style-default');
        var userLinkDefault = document.getElementById('user-style-default');
        linkDefault.setAttribute('disabled', true);
        userLinkDefault.setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        var linkRTL = document.getElementById('style-rtl');
        var userLinkRTL = document.getElementById('user-style-rtl');
        linkRTL.setAttribute('disabled', true);
        userLinkRTL.setAttribute('disabled', true);
      }
    </script>

    <link href="{{ url_for('static', path='vendors/leaflet.markercluster/MarkerCluster.Default.css') }}" rel="stylesheet">

    <!-- ===============================================-->
    <!--  Batch 9: RTL / dark-mode chart + icon safety   -->
    <!-- ===============================================-->
    <script>
    (function () {
      // Re-render every ECharts instance once layout has settled. In RTL the
      // chart containers can initialise at width 0; a couple of delayed resizes
      // guarantee they paint. Also re-run on theme flips and viewport resizes.
      function resizeAllCharts() {
        if (!window.echarts) return;
        document.querySelectorAll('[_echarts_instance_], [data-isfc-chart], .echart, .echart-chart, [class*="echart"]').forEach(function (el) {
          try { var i = window.echarts.getInstanceByDom(el); if (i) i.resize(); } catch (e) {}
        });
        if (window.isfcTableTools && window.isfcTableTools.resizeCharts) {
          try { window.isfcTableTools.resizeCharts(); } catch (e) {}
        }
      }
      function refreshIcons() {
        try { if (window.feather) window.feather.replace(); } catch (e) {}
      }
      window.addEventListener('load', function () {
        [120, 400, 900, 1600].forEach(function (ms) { setTimeout(resizeAllCharts, ms); });
        refreshIcons();
      });
      window.addEventListener('resize', function () { setTimeout(resizeAllCharts, 150); });
      // React to theme (data-bs-theme) and direction (dir) changes.
      try {
        new MutationObserver(function () {
          setTimeout(resizeAllCharts, 60);
          setTimeout(resizeAllCharts, 350);
          refreshIcons();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme', 'dir', 'class'] });
      } catch (e) {}
      // When a Bootstrap tab becomes visible, its charts finally have width.
      document.addEventListener('shown.bs.tab', function () { setTimeout(resizeAllCharts, 60); });
      document.addEventListener('shown.bs.collapse', function () { setTimeout(resizeAllCharts, 60); });
    })();
    </script>
