<!-- # app/templates/partials/header.html -->

   <div class="modal fade" id="searchBoxModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="true" style="--phoenix-backdrop-opacity: 1;">
    <div class="modal-dialog modal-lg">
      <div class="modal-content mt-10">
        <div class="modal-body p-0">
          <!-- Batch 14: LIVE global search — queries /search/api across the whole ERP -->
          <form class="position-relative m-3 mb-2" action="/search" method="get">
            <input class="form-control search-input rounded-pill form-control-lg" id="isfcGlobalSearch"
                   type="search" name="q" placeholder="{{ t('Search orders, invoices, items, customers, reports…') }}"
                   autocomplete="off" aria-label="Search" />
            <span class="fas fa-search search-box-icon"></span>
          </form>
          <div id="isfcSearchResults" class="px-2 pb-3 scrollbar" style="max-height: 60vh; overflow-y: auto;">
            <p class="text-body-tertiary text-center fs-9 my-3">{{ t('Type at least 2 characters — results come live from the database. Press Enter for the full results page.') }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var input = document.getElementById('isfcGlobalSearch');
    var box = document.getElementById('isfcSearchResults');
    if (!input || !box) return;
    var timer = null, seq = 0;

    function esc(x) { return String(x || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function draw(data) {
      if (!data.groups.length) {
        box.innerHTML = '<p class="text-body-tertiary text-center fs-9 my-3">No results for “' + esc(data.q) + '”.</p>';
        return;
      }
      var html = '';
      data.groups.forEach(function (g) {
        html += '<h6 class="dropdown-header text-body-highlight fs-9 border-bottom border-translucent py-2">' + esc(g.title) + '</h6>';
        g.rows.forEach(function (r) {
          html += '<a class="dropdown-item py-2" href="' + esc(r.url) + '">' +
            '<div class="d-flex justify-content-between align-items-center gap-2">' +
            '<div class="min-w-0"><div class="fw-semibold text-body-highlight text-truncate">' + esc(r.title) + '</div>' +
            (r.subtitle ? '<div class="fs-10 text-body-tertiary text-truncate">' + esc(r.subtitle) + '</div>' : '') +
            '</div>' +
            (r.meta ? '<span class="badge badge-phoenix badge-phoenix-secondary">' + esc(r.meta) + '</span>' : '') +
            '</div></a>';
        });
      });
      html += '<div class="text-center pt-2"><a class="btn btn-sm btn-phoenix-primary" href="/search?q=' +
        encodeURIComponent(data.q) + '">View all ' + data.total + ' results</a></div>';
      box.innerHTML = html;
    }

    input.addEventListener('input', function () {
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) {
        box.innerHTML = '<p class="text-body-tertiary text-center fs-9 my-3">Type at least 2 characters…</p>';
        return;
      }
      timer = setTimeout(async function () {
        var mySeq = ++seq;
        try {
          var res = await fetch('/search/api?q=' + encodeURIComponent(q));
          var data = await res.json();
          if (mySeq === seq) draw(data);
        } catch (e) { /* keep previous results */ }
      }, 250);
    });

    // focus the input whenever the modal opens
    document.getElementById('searchBoxModal').addEventListener('shown.bs.modal', function () {
      input.focus();
    });
  })();
  </script>
