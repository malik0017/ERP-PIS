services:
  db:
    image: mysql:8.0
    container_name: isfc_mysql
    environment:
      MYSQL_DATABASE: isfc_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: isfc
      MYSQL_PASSWORD: isfc123
    ports:
      - "3307:3306"        # 3307 outside so it never clashes with Laragon's MySQL on 3306
    volumes:
      - isfc_mysql_data:/var/lib/mysql
    healthcheck:           # web waits for THIS to pass before starting
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: isfc_web
    depends_on:
      db:
        condition: service_healthy   # fixes the crash-loop: no more connecting before MySQL is ready
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://isfc:isfc123@db:3306/isfc_db
      SECRET_KEY: change-this-in-production
      APP_NAME: ISFC PIMS

volumes:
  isfc_mysql_data:
